name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - name: Create project
        run: |
          mkdir -p app/src/main/java/com/swipe/launcher
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "SwipeLauncher"
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.2.2' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
          }
          android {
            namespace 'com.swipe.launcher'
            compileSdk 34
            defaultConfig {
              applicationId 'com.swipe.launcher'
              minSdk 24
              targetSdk 34
              versionCode 8
              versionName '2.6'
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions { jvmTarget = '17' }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <queries>
              <intent>
                <action android:name="android.intent.action.MAIN"/>
                <category android:name="android.intent.category.LAUNCHER"/>
              </intent>
            </queries>
            <application android:label="Swipe Launcher">
              <activity android:name=".MainActivity"
                android:exported="true"
                android:launchMode="singleTask"
                android:theme="@android:style/Theme.Wallpaper.NoTitleBar">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                  <category android:name="android.intent.category.HOME"/>
                  <category android:name="android.intent.category.DEFAULT"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/swipe/launcher/MainActivity.kt <<'EOF'
          package com.swipe.launcher

          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Intent
          import android.content.pm.ResolveInfo
          import android.graphics.Color
          import android.os.Build
          import android.os.Bundle
          import android.text.TextUtils
          import android.view.Gravity
          import android.view.GestureDetector
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewGroup
          import android.view.WindowInsets
          import android.view.WindowInsetsController
          import android.view.WindowManager
          import android.widget.BaseAdapter
          import android.widget.Button
          import android.widget.EditText
          import android.widget.FrameLayout
          import android.widget.GridView
          import android.widget.HorizontalScrollView
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import kotlin.math.abs

          class MainActivity : Activity() {
              private class Item(val label: String, val pkg: String?, val folder: String?, val res: ResolveInfo?)

              private val names = linkedMapOf(
                  "1_down" to "1 viral: Melirunthu keela",
                  "1_left" to "1 viral: Valathu -> Idathu",
                  "1_right" to "1 viral: Idathu -> Valathu",
                  "2_up" to "2 viral: Keelirunthu mela",
                  "2_down" to "2 viral: Melirunthu keela",
                  "2_left" to "2 viral: Valathu -> Idathu",
                  "2_right" to "2 viral: Idathu -> Valathu"
              )
              private val prefs by lazy { getSharedPreferences("p", MODE_PRIVATE) }
              private var mode = 0
              private var sx = 0f; private var sy = 0f
              private var lx = 0f; private var ly = 0f
              private var maxP = 0

              private fun hideStatus() = mode == 0 && prefs.getBoolean("hide_status", false)
              private fun hideNav() = prefs.getBoolean("hide_nav", true)

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  if (prefs.all.isEmpty()) showSettings() else showHome()
              }

              override fun onNewIntent(i: Intent?) {
                  super.onNewIntent(i)
                  showHome()
              }

              override fun onWindowFocusChanged(f: Boolean) {
                  super.onWindowFocusChanged(f)
                  if (f) hideBars()
              }

              override fun onBackPressed() {
                  if (mode == 3) showDrawer() else if (mode != 0) showHome()
              }

              @Suppress("DEPRECATION")
              private fun hideBars() {
                  if (hideStatus()) window.addFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN)
                  else window.clearFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN)
                  if (Build.VERSION.SDK_INT >= 30) {
                      window.insetsController?.let {
                          var t = 0
                          if (hideStatus()) t = t or WindowInsets.Type.statusBars()
                          if (hideNav()) t = t or WindowInsets.Type.navigationBars()
                          it.show(WindowInsets.Type.systemBars())
                          if (t != 0) it.hide(t)
                          it.systemBarsBehavior = WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                      }
                  } else {
                      var f = View.SYSTEM_UI_FLAG_LAYOUT_STABLE or View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      if (hideNav()) f = f or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      if (hideStatus()) f = f or View.SYSTEM_UI_FLAG_FULLSCREEN
                      window.decorView.systemUiVisibility = f
                  }
              }

              private fun showHome() {
                  mode = 0
                  val gd = GestureDetector(this, object : GestureDetector.SimpleOnGestureListener() {
                      override fun onLongPress(e: MotionEvent) { showSettings() }
                  })
                  val v = View(this)
                  v.setOnTouchListener { _, e -> gd.onTouchEvent(e); handle(e); true }
                  setContentView(v)
                  hideBars()
              }

              private fun cen(e: MotionEvent): FloatArray {
                  var x = 0f; var y = 0f
                  for (i in 0 until e.pointerCount) { x += e.getX(i); y += e.getY(i) }
                  return floatArrayOf(x / e.pointerCount, y / e.pointerCount)
              }

              private fun handle(e: MotionEvent) {
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> {
                          maxP = 1
                          val c = cen(e); sx = c[0]; sy = c[1]; lx = sx; ly = sy
                      }
                      MotionEvent.ACTION_POINTER_DOWN -> {
                          maxP = maxOf(maxP, e.pointerCount)
                          val c = cen(e); sx = c[0]; sy = c[1]; lx = sx; ly = sy
                      }
                      MotionEvent.ACTION_MOVE -> if (e.pointerCount >= maxP) {
                          val c = cen(e); lx = c[0]; ly = c[1]
                      }
                      MotionEvent.ACTION_UP -> {
                          val dx = lx - sx; val dy = ly - sy
                          if (maxOf(abs(dx), abs(dy)) > 80) {
                              val d = if (abs(dx) > abs(dy)) (if (dx > 0) "right" else "left")
                                      else (if (dy > 0) "down" else "up")
                              val k = "${minOf(maxP, 2)}_$d"
                              if (k == "1_up") { dIdx = 0; showDrawer() } else launch(k)
                          }
                      }
                  }
              }

              private fun launchPkg(p: String) {
                  packageManager.getLaunchIntentForPackage(p)?.let { startActivity(it) }
              }

              private fun launch(k: String) {
                  val p = prefs.getString(k, null)
                  if (p == null) {
                      Toast.makeText(this, "Indha gesture ku app set pannala. Long press panni set pannunga", Toast.LENGTH_LONG).show()
                      return
                  }
                  launchPkg(p)
              }

              private fun allApps(): List<ResolveInfo> {
                  val pm = packageManager
                  return pm.queryIntentActivities(
                      Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER), 0)
                      .filter { it.activityInfo.packageName != packageName }
                      .sortedBy { it.loadLabel(pm).toString().lowercase() }
              }

              private fun folderNames(): List<String> {
                  val s: Set<String> = prefs.getStringSet("folders", null) ?: emptySet()
                  return s.sorted()
              }

              private fun folderApps(n: String): HashSet<String> {
                  val s: Set<String> = prefs.getStringSet("f_$n", null) ?: emptySet()
                  return HashSet(s)
              }

              private fun saveFolder(n: String, s: Set<String>) {
                  prefs.edit().putStringSet("f_$n", HashSet(s)).apply()
              }

              private fun newFolder(n: String) {
                  val s = HashSet(folderNames())
                  s.add(n)
                  prefs.edit().putStringSet("folders", s).apply()
              }

              private fun deleteFolder(n: String) {
                  val s = HashSet(folderNames())
                  s.remove(n)
                  prefs.edit().putStringSet("folders", s).remove("f_$n").apply()
              }

              private fun moveToFolder(pkg: String, n: String) {
                  for (f in folderNames()) {
                      val o = folderApps(f)
                      if (o.remove(pkg)) saveFolder(f, o)
                  }
                  val a = folderApps(n)
                  a.add(pkg)
                  saveFolder(n, a)
              }

              private fun askName(cb: (String) -> Unit) {
                  val e = EditText(this)
                  AlertDialog.Builder(this)
                      .setTitle("Folder peyar")
                      .setView(e)
                      .setPositiveButton("OK") { _, _ ->
                          val n = e.text.toString().trim()
                          if (n.isNotEmpty()) cb(n)
                      }
                      .setNegativeButton("Cancel", null)
                      .show()
              }

              private fun makeGrid(items: List<Item>, onClick: (Item) -> Unit, onLong: (Item) -> Unit): GridView {
                  val pm = packageManager
                  val g = GridView(this)
                  g.numColumns = 4
                  g.adapter = object : BaseAdapter() {
                      override fun getCount() = items.size
                      override fun getItem(p: Int) = items[p]
                      override fun getItemId(p: Int) = p.toLong()
                      override fun getView(p: Int, cv: View?, parent: ViewGroup?): View {
                          val a = items[p]
                          val l = LinearLayout(this@MainActivity)
                          l.orientation = LinearLayout.VERTICAL
                          l.gravity = Gravity.CENTER
                          l.setPadding(4, 24, 4, 24)
                          val r = a.res
                          if (r != null) {
                              val i = ImageView(this@MainActivity)
                              i.setImageDrawable(r.loadIcon(pm))
                              i.layoutParams = LinearLayout.LayoutParams(132, 132)
                              l.addView(i)
                          } else {
                              val e = TextView(this@MainActivity)
                              e.text = "\uD83D\uDCC1"
                              e.textSize = 36f
                              e.gravity = Gravity.CENTER
                              l.addView(e)
                          }
                          val t = TextView(this@MainActivity)
                          t.text = a.label
                          t.setTextColor(Color.WHITE)
                          t.textSize = 12f
                          t.maxLines = 1
                          t.gravity = Gravity.CENTER
                          t.ellipsize = TextUtils.TruncateAt.END
                          l.addView(t)
                          return l
                      }
                  }
                  g.setOnItemClickListener { _, _, p, _ -> onClick(items[p]) }
                  g.setOnItemLongClickListener { _, _, p, _ -> onLong(items[p]); true }
                  return g
              }

              private var dIdx = 0

              private fun showDrawer() {
                  mode = 1
                  val pm = packageManager
                  val tabs = ArrayList<String>()
                  tabs.add("Application")
                  tabs.addAll(folderNames())
                  if (dIdx >= tabs.size || dIdx < 0) dIdx = 0
                  val cur = tabs[dIdx]
                  val set = folderApps(cur)
                  val inF = HashSet<String>()
                  for (f in folderNames()) inF.addAll(folderApps(f))
                  val items = ArrayList<Item>()
                  for (r in allApps()) {
                      val pk = r.activityInfo.packageName
                      if (if (dIdx == 0) !inF.contains(pk) else set.contains(pk)) items.add(Item(r.loadLabel(pm).toString(), pk, null, r))
                  }
                  val grid = makeGrid(items, { it2 -> launchPkg(it2.pkg ?: "") }, { it2 ->
                      if (dIdx == 0) {
                          addToFolder(it2.pkg ?: "")
                      } else {
                          AlertDialog.Builder(this).setTitle("Folder la irunthu eduka?")
                              .setPositiveButton("Aama") { _, _ ->
                                  val a = folderApps(cur); a.remove(it2.pkg ?: ""); saveFolder(cur, a)
                                  showDrawer()
                              }
                              .setNegativeButton("Venaam", null).show()
                      }
                  })
                  grid.setPadding(16, 16, 16, 48)
                  var gx = 0f
                  var gy = 0f
                  grid.setOnTouchListener { _, e ->
                      if (e.action == MotionEvent.ACTION_DOWN) { gx = e.x; gy = e.y }
                      if (e.action == MotionEvent.ACTION_UP) {
                          val dx = e.x - gx
                          val dy = e.y - gy
                          if (abs(dx) > 200 && abs(dx) > abs(dy) * 1.5f) {
                              if (dx < 0 && dIdx < tabs.size - 1) { dIdx++; showDrawer() }
                              else if (dx > 0 && dIdx > 0) { dIdx--; showDrawer() }
                          } else if (dy > 250 && abs(dy) > abs(dx)) {
                              val c = grid.getChildAt(0)
                              if (grid.firstVisiblePosition == 0 && (c == null || c.top >= grid.paddingTop)) showHome()
                          }
                      }
                      false
                  }
                  val row = LinearLayout(this)
                  row.orientation = LinearLayout.HORIZONTAL
                  for (i in tabs.indices) {
                      val t = TextView(this)
                      t.text = tabs[i]
                      t.textSize = 18f
                      t.setPadding(28, 20, 28, 20)
                      if (i == dIdx) {
                          t.setTextColor(Color.WHITE)
                          t.setTypeface(null, android.graphics.Typeface.BOLD)
                      } else {
                          t.setTextColor(Color.GRAY)
                      }
                      t.setOnClickListener { dIdx = i; showDrawer() }
                      if (i > 0) t.setOnLongClickListener {
                          AlertDialog.Builder(this).setTitle("Folder '" + tabs[i] + "' delete pannalama?")
                              .setPositiveButton("Delete") { _, _ -> deleteFolder(tabs[i]); dIdx = 0; showDrawer() }
                              .setNegativeButton("Cancel", null).show()
                          true
                      }
                      row.addView(t)
                  }
                  val plus = TextView(this)
                  plus.text = "+"
                  plus.textSize = 22f
                  plus.setTextColor(Color.GRAY)
                  plus.setPadding(28, 16, 28, 16)
                  plus.setOnClickListener {
                      askName { n -> newFolder(n); dIdx = folderNames().indexOf(n) + 1; showDrawer() }
                  }
                  row.addView(plus)
                  val hs = HorizontalScrollView(this)
                  hs.isHorizontalScrollBarEnabled = false
                  hs.addView(row)
                  val box = LinearLayout(this)
                  box.orientation = LinearLayout.VERTICAL
                  box.setBackgroundColor(Color.argb(235, 0, 0, 0))
                  box.setPadding(0, 24, 0, 0)
                  box.addView(hs)
                  if (dIdx > 0 && items.isEmpty()) {
                      val h = TextView(this)
                      h.text = "Folder kaali. Application la app ah long press panni serkkavum."
                      h.setTextColor(Color.GRAY)
                      h.setPadding(32, 24, 32, 0)
                      box.addView(h)
                  }
                  box.addView(grid, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f))
                  setContentView(box)
                  hideBars()
              }

              private fun addToFolder(pkg: String) {
                  val fs = folderNames()
                  val opts = ArrayList<String>(fs)
                  opts.add("+ Puthu folder")
                  AlertDialog.Builder(this)
                      .setTitle("Entha folder la serkanum?")
                      .setItems(opts.toTypedArray()) { _, i ->
                          if (i < fs.size) {
                              moveToFolder(pkg, fs[i]); showDrawer()
                          } else {
                              askName { n -> newFolder(n); moveToFolder(pkg, n); showDrawer() }
                          }
                      }.show()
              }

              private fun label(p: String?): String = try {
                  if (p == null) "-" else packageManager.getApplicationInfo(p, 0).loadLabel(packageManager).toString()
              } catch (e: Exception) { "-" }

              private fun title(box: LinearLayout, s: String) {
                  val t = TextView(this)
                  t.text = s
                  t.setTextColor(Color.WHITE)
                  t.textSize = 16f
                  t.setPadding(0, 32, 0, 8)
                  box.addView(t)
              }

              private fun toggle(box: LinearLayout, key: String, name: String, def: Boolean) {
                  val b = Button(this)
                  b.isAllCaps = false
                  val on = prefs.getBoolean(key, def)
                  b.text = name + ": " + (if (on) "Maraichu (hidden)" else "Kaattu (shown)")
                  b.setOnClickListener {
                      prefs.edit().putBoolean(key, !on).apply()
                      hideBars()
                      showSettings()
                  }
                  box.addView(b)
              }

              private fun showSettings() {
                  mode = 2
                  val box = LinearLayout(this)
                  box.orientation = LinearLayout.VERTICAL
                  box.setPadding(32, 96, 32, 64)
                  title(box, "Display")
                  toggle(box, "hide_status", "Notification bar", false)
                  toggle(box, "hide_nav", "Navigation buttons", true)
                  title(box, "Gestures (1 viral mela = App drawer)")
                  for ((k, name) in names) {
                      val b = Button(this)
                      b.isAllCaps = false
                      b.text = name + "  =>  " + label(prefs.getString(k, null))
                      b.setOnClickListener { pick(k) }
                      box.addView(b)
                  }
                  title(box, "Folders (App drawer la app ah long press panni serkalam)")
                  val nf = Button(this)
                  nf.isAllCaps = false
                  nf.text = "+ Puthu folder"
                  nf.setOnClickListener { askName { n -> newFolder(n); showSettings() } }
                  box.addView(nf)
                  for (f in folderNames()) {
                      val b = Button(this)
                      b.isAllCaps = false
                      b.text = "Folder: " + f + " (" + folderApps(f).size + " apps) - delete panna tap"
                      b.setOnClickListener {
                          AlertDialog.Builder(this).setTitle("Folder '" + f + "' delete pannalama?")
                              .setPositiveButton("Delete") { _, _ -> deleteFolder(f); showSettings() }
                              .setNegativeButton("Cancel", null).show()
                      }
                      box.addView(b)
                  }
                  val done = Button(this)
                  done.text = "Done"
                  done.setOnClickListener { showHome() }
                  box.addView(done)
                  val sv = ScrollView(this)
                  sv.setBackgroundColor(Color.BLACK)
                  sv.addView(box)
                  setContentView(sv)
                  hideBars()
              }

              private fun pick(k: String) {
                  val pm = packageManager
                  val apps = allApps()
                  AlertDialog.Builder(this)
                      .setTitle(names[k])
                      .setItems(apps.map { it.loadLabel(pm).toString() }.toTypedArray()) { _, i ->
                          prefs.edit().putString(k, apps[i].activityInfo.packageName).apply()
                          showSettings()
                      }.show()
              }
          }
          EOF
      - name: Build
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SwipeLauncher
          path: app/build/outputs/apk/debug/app-debug.apk
