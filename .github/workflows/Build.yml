name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - name: Create project
        run: |
          mkdir -p app/src/main/java/com/swipe/launcher
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "SwipeLauncher"
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.2.2' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
          }
          android {
            namespace 'com.swipe.launcher'
            compileSdk 34
            defaultConfig {
              applicationId 'com.swipe.launcher'
              minSdk 24
              targetSdk 34
              versionCode 2
              versionName '2.0'
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions { jvmTarget = '17' }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <queries>
              <intent>
                <action android:name="android.intent.action.MAIN"/>
                <category android:name="android.intent.category.LAUNCHER"/>
              </intent>
            </queries>
            <application android:label="Swipe Launcher">
              <activity android:name=".MainActivity"
                android:exported="true"
                android:launchMode="singleTask"
                android:theme="@android:style/Theme.Wallpaper.NoTitleBar.Fullscreen">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                  <category android:name="android.intent.category.HOME"/>
                  <category android:name="android.intent.category.DEFAULT"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/swipe/launcher/MainActivity.kt <<'EOF'
          package com.swipe.launcher

          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Intent
          import android.graphics.Color
          import android.os.Bundle
          import android.text.TextUtils
          import android.view.Gravity
          import android.view.GestureDetector
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewGroup
          import android.widget.BaseAdapter
          import android.widget.Button
          import android.widget.GridView
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import kotlin.math.abs

          class MainActivity : Activity() {
              private val names = mapOf(
                  "1_down" to "1 viral: Melirunthu keela",
                  "1_left" to "1 viral: Valathu -> Idathu",
                  "1_right" to "1 viral: Idathu -> Valathu",
                  "2_up" to "2 viral: Keelirunthu mela",
                  "2_down" to "2 viral: Melirunthu keela",
                  "2_left" to "2 viral: Valathu -> Idathu",
                  "2_right" to "2 viral: Idathu -> Valathu"
              )
              private val prefs by lazy { getSharedPreferences("p", MODE_PRIVATE) }
              private var mode = 0
              private var sx = 0f; private var sy = 0f
              private var lx = 0f; private var ly = 0f
              private var maxP = 0

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  showHome()
              }

              override fun onNewIntent(i: Intent?) {
                  super.onNewIntent(i)
                  showHome()
              }

              override fun onWindowFocusChanged(f: Boolean) {
                  super.onWindowFocusChanged(f)
                  if (f) hideBars()
              }

              override fun onBackPressed() {
                  if (mode != 0) showHome()
              }

              @Suppress("DEPRECATION")
              private fun hideBars() {
                  window.decorView.systemUiVisibility =
                      View.SYSTEM_UI_FLAG_LAYOUT_STABLE or
                      View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION or
                      View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN or
                      View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or
                      View.SYSTEM_UI_FLAG_FULLSCREEN or
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
              }

              private fun showHome() {
                  mode = 0
                  val gd = GestureDetector(this, object : GestureDetector.SimpleOnGestureListener() {
                      override fun onLongPress(e: MotionEvent) { showSettings() }
                  })
                  val v = View(this)
                  v.setOnTouchListener { _, e -> gd.onTouchEvent(e); handle(e); true }
                  setContentView(v)
                  hideBars()
              }

              private fun cen(e: MotionEvent): FloatArray {
                  var x = 0f; var y = 0f
                  for (i in 0 until e.pointerCount) { x += e.getX(i); y += e.getY(i) }
                  return floatArrayOf(x / e.pointerCount, y / e.pointerCount)
              }

              private fun handle(e: MotionEvent) {
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> {
                          maxP = 1
                          val c = cen(e); sx = c[0]; sy = c[1]; lx = sx; ly = sy
                      }
                      MotionEvent.ACTION_POINTER_DOWN -> {
                          maxP = maxOf(maxP, e.pointerCount)
                          val c = cen(e); sx = c[0]; sy = c[1]; lx = sx; ly = sy
                      }
                      MotionEvent.ACTION_MOVE -> if (e.pointerCount >= maxP) {
                          val c = cen(e); lx = c[0]; ly = c[1]
                      }
                      MotionEvent.ACTION_UP -> {
                          val dx = lx - sx; val dy = ly - sy
                          if (maxOf(abs(dx), abs(dy)) > 120) {
                              val d = if (abs(dx) > abs(dy)) (if (dx > 0) "right" else "left")
                                      else (if (dy > 0) "down" else "up")
                              val k = "${minOf(maxP, 2)}_$d"
                              if (k == "1_up") showDrawer() else launch(k)
                          }
                      }
                  }
              }

              private fun launch(k: String) {
                  val p = prefs.getString(k, null) ?: return
                  packageManager.getLaunchIntentForPackage(p)?.let { startActivity(it) }
              }

              private fun showDrawer() {
                  mode = 1
                  val pm = packageManager
                  val apps = pm.queryIntentActivities(
                      Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER), 0)
                      .filter { it.activityInfo.packageName != packageName }
                      .sortedBy { it.loadLabel(pm).toString().lowercase() }
                  val grid = GridView(this)
                  grid.numColumns = 4
                  grid.setPadding(16, 96, 16, 48)
                  grid.setBackgroundColor(Color.argb(235, 0, 0, 0))
                  grid.adapter = object : BaseAdapter() {
                      override fun getCount() = apps.size
                      override fun getItem(p: Int) = apps[p]
                      override fun getItemId(p: Int) = p.toLong()
                      override fun getView(p: Int, cv: View?, parent: ViewGroup?): View {
                          val a = apps[p]
                          val l = LinearLayout(this@MainActivity)
                          l.orientation = LinearLayout.VERTICAL
                          l.gravity = Gravity.CENTER
                          l.setPadding(4, 24, 4, 24)
                          val i = ImageView(this@MainActivity)
                          i.setImageDrawable(a.loadIcon(pm))
                          i.layoutParams = LinearLayout.LayoutParams(132, 132)
                          val t = TextView(this@MainActivity)
                          t.text = a.loadLabel(pm)
                          t.setTextColor(Color.WHITE)
                          t.textSize = 12f
                          t.maxLines = 1
                          t.gravity = Gravity.CENTER
                          t.ellipsize = TextUtils.TruncateAt.END
                          l.addView(i)
                          l.addView(t)
                          return l
                      }
                  }
                  grid.setOnItemClickListener { _, _, pos, _ ->
                      pm.getLaunchIntentForPackage(apps[pos].activityInfo.packageName)
                          ?.let { startActivity(it) }
                  }
                  var gy = 0f
                  grid.setOnTouchListener { _, e ->
                      if (e.action == MotionEvent.ACTION_DOWN) gy = e.y
                      if (e.action == MotionEvent.ACTION_UP && e.y - gy > 250) {
                          val c = grid.getChildAt(0)
                          if (grid.firstVisiblePosition == 0 && (c == null || c.top >= grid.paddingTop)) showHome()
                      }
                      false
                  }
                  setContentView(grid)
                  hideBars()
              }

              private fun label(p: String?): String = try {
                  if (p == null) "-" else packageManager.getApplicationInfo(p, 0).loadLabel(packageManager).toString()
              } catch (e: Exception) { "-" }

              private fun showSettings() {
                  mode = 2
                  val box = LinearLayout(this)
                  box.orientation = LinearLayout.VERTICAL
                  box.setPadding(32, 96, 32, 32)
                  val t = TextView(this)
                  t.text = "Gesture settings - tap panni app select pannunga\n(1 viral mela = App drawer)"
                  t.setTextColor(Color.WHITE)
                  t.textSize = 18f
                  box.addView(t)
                  for ((k, name) in names) {
                      val b = Button(this)
                      b.isAllCaps = false
                      b.text = name + "  =>  " + label(prefs.getString(k, null))
                      b.setOnClickListener { pick(k) }
                      box.addView(b)
                  }
                  val done = Button(this)
                  done.text = "Done"
                  done.setOnClickListener { showHome() }
                  box.addView(done)
                  val sv = ScrollView(this)
                  sv.setBackgroundColor(Color.BLACK)
                  sv.addView(box)
                  setContentView(sv)
                  hideBars()
              }

              private fun pick(k: String) {
                  val pm = packageManager
                  val apps = pm.queryIntentActivities(
                      Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER), 0)
                      .filter { it.activityInfo.packageName != packageName }
                      .sortedBy { it.loadLabel(pm).toString().lowercase() }
                  AlertDialog.Builder(this)
                      .setTitle(names[k])
                      .setItems(apps.map { it.loadLabel(pm).toString() }.toTypedArray()) { _, i ->
                          prefs.edit().putString(k, apps[i].activityInfo.packageName).apply()
                          showSettings()
                      }.show()
              }
          }
          EOF
      - name: Build
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SwipeLauncher
          path: app/build/outputs/apk/debug/app-debug.apk
